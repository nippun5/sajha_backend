services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sajha
      MYSQL_USER: sajha_dev
      MYSQL_PASSWORD: dev_password_only
      MYSQL_ROOT_PASSWORD: local_root_only_change_me
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - sajha_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  sajha_mysql:
