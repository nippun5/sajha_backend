server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
spring:
  application:
    name: sajha-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/sajha?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${DB_USERNAME:sajha_dev}
    password: ${DB_PASSWORD:dev_password_only}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  auth:
    jwt-secret-base64: ${JWT_SECRET_BASE64:}
    issuer: ${JWT_ISSUER:sajha-api}
    access-minutes: 15
    refresh-days: 30
  sms:
    twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
    twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
    twilio-verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
